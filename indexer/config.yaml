name: beyini-indexer
description: High-throughput indexer for Beyini payment routing protocol on Monad
networks:
  - id: 10143
    rpc_config:
      url: https://testnet-rpc.monad.xyz
    start_block: 59880000
    contracts:
      - name: BeyiniEscrow
        address:
          - "0x534b2f3A21130d7a60830c2Df862319e593943A3"
        handler: src/EventHandlers.ts
        events:
          - event: PaymentDeposited(bytes32 indexed paymentId, address indexed sender, address indexed token, uint256 amount, bytes32 commitment, uint64 expiry)
          - event: PaymentClaimed(bytes32 indexed paymentId, address indexed destination, uint256 amount, address token)
          - event: PaymentRefunded(bytes32 indexed paymentId, address indexed sender, uint256 amount, address token)
